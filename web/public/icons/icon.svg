<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3a1c"/>
      <stop offset="100%" stop-color="#04210f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#00c853" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00c853" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ball" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6e6da"/>
    </linearGradient>
  </defs>

  <!-- Opaque ground: works as `any` and survives Android's maskable crop -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Ball sits inside the maskable safe zone (centre 80% = r<=205) -->
  <g transform="translate(256 256)">
    <circle r="150" fill="url(#ball)"/>
    <circle r="150" fill="none" stroke="#00c853" stroke-width="9" opacity="0.9"/>
    <!-- classic truncated-icosahedron panels -->
    <g fill="#06240f">
      <polygon points="0,-78 74,-24 46,64 -46,64 -74,-24"/>
      <polygon points="0,-150 44,-119 30,-88 -30,-88 -44,-119"/>
      <polygon points="150,0 119,44 88,30 88,-30 119,-44" transform="rotate(-18)"/>
      <polygon points="150,0 119,44 88,30 88,-30 119,-44" transform="rotate(54)"/>
      <polygon points="150,0 119,44 88,30 88,-30 119,-44" transform="rotate(126)"/>
      <polygon points="150,0 119,44 88,30 88,-30 119,-44" transform="rotate(198)"/>
    </g>
    <g stroke="#06240f" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M0,-150 L0,-78"/>
      <path d="M74,-24 L142,-46"/>
      <path d="M46,64 L88,124"/>
      <path d="M-46,64 L-88,124"/>
      <path d="M-74,-24 L-142,-46"/>
    </g>
  </g>
</svg>
